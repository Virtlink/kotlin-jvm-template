---
name: Build

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: 'Build'
    strategy:
      matrix:
        os:
          - 'ubuntu-latest'
        java:
          - version: '21'
        gradle:
          - version: '9.5.1'      # Latest stable 9
            command: 'gradle'
          - version: 'current'    # Latest stable
            command: 'gradle'
          - version: 'wrapper'
            command: './gradlew'  # Workaround for issue https://github.com/gradle/actions/issues/273
    runs-on: ${{ matrix.os }}
    steps:

      - name: 'Checkout'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          # Gitonium doesn't work on a sparse repository:
          # it requires all tags of all commits to be fetched
          fetch-depth: 0
          fetch-tags: true

      - name: "Setup JDK temurin ${{ matrix.java.version }}"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          java-version: ${{ matrix.java.version }}
          distribution: 'temurin'

      - name: "Setup Gradle ${{ matrix.gradle.version }}"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          gradle-version: ${{ matrix.gradle.version }}
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"

      - name: 'Build'
        run: |
          ${{matrix.gradle.command}} build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
