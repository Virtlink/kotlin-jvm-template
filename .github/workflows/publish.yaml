---
name: Publish

on:  # yamllint disable-line rule:truthy
  push:
    tags:
      - "*.*.*"

jobs:
  publish:
    name: 'Publish'
    permissions:
      contents: write
      packages: write
    strategy:
      matrix:
        include:
          - os: 'ubuntu-latest'
            java:
              version: '21'
            gradle:
              version: 'wrapper'
              command: './gradlew'  # Workaround for issue https://github.com/gradle/actions/issues/273
    runs-on: ${{ matrix.os }}
    steps:

      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: "Setup JDK temurin ${{ matrix.java.version }}"
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          java-version: ${{ matrix.java.version }}
          distribution: 'temurin'

      - name: "Setup Gradle ${{ matrix.gradle.version }}"
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1
        with:
          gradle-version: ${{ matrix.gradle.version }}
          build-scan-publish: false   # Might contain private keys or sensitive information

      - name: 'Publish to Maven Central'
        run: |
          ${{matrix.gradle.command}} assemble publish closeAndReleaseSonatypeStagingRepository
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      # Obtain the derived version number in the env.VERSION variable.
      - run: echo "VERSION=$(${{matrix.gradle.command}} -q :printVersion -Dorg.gradle.configuration-cache=false)" >> $GITHUB_ENV

      - name: 'Release on GitHub'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          name: "Release ${{ env.VERSION }}"
          files: |
            **/build/libs/*
          fail_on_unmatched_files: true
