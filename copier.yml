#####################
## Copier settings ##
#####################

_exclude:
  - "copier.yaml"
  - "copier.yml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  - "license.*.md"
  - "license.*.txt"
  - "license.*.summary.md"